<svg width="850" height="280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background styling to match GitHub Dark Mode perfectly -->
    <rect id="bg" width="850" height="280" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
    
    <!-- Glowing path gradient -->
    <linearGradient id="pathGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30363D" />
      <stop offset="50%" stop-color="#388BFD" />
      <stop offset="100%" stop-color="#30363D" />
    </linearGradient>

    <!-- Pulse filter for nodes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <use href="#bg" />

  <!-- Connecting Lines -->
  <path d="M 190 140 L 340 140" stroke="url(#pathGradient)" stroke-width="2" fill="none" stroke-dasharray="4 4">
    <animate attributeName="stroke-dashoffset" values="8;0" dur="0.5s" repeatCount="indefinite"/>
  </path>
  <path d="M 510 140 L 660 140" stroke="url(#pathGradient)" stroke-width="2" fill="none" stroke-dasharray="4 4">
    <animate attributeName="stroke-dashoffset" values="8;0" dur="0.5s" repeatCount="indefinite"/>
  </path>

  <!-- Animated Data Packets Flowing -->
  <circle r="4" fill="#58A6FF" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 190 140 L 340 140" />
    <animate attributeName="opacity" values="0;1;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle r="4" fill="#3FB950" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M 510 140 L 660 140" begin="1s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- Left Node: Unstructured PDF -->
  <g transform="translate(60, 90)">
    <rect width="130" height="100" fill="#161B22" stroke="#30363D" stroke-width="2" rx="8"/>
    <text x="65" y="-15" fill="#8B949E" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">UNSTRUCTURED INPUT</text>
    
    <!-- Abstract text lines representing messy PDF -->
    <path d="M 30 30 L 70 30 M 30 50 L 100 50 M 30 70 L 80 70" stroke="#8B949E" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Animated Scanning Laser -->
    <line x1="20" y1="20" x2="110" y2="20" stroke="#388BFD" stroke-width="2" opacity="0.8" filter="url(#glow)">
      <animate attributeName="y1" values="20;80;20" dur="3s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline"/>
      <animate attributeName="y2" values="20;80;20" dur="3s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline"/>
    </line>
  </g>

  <!-- Center Node: Gemini Processing Core -->
  <g transform="translate(340, 75)">
    <rect width="170" height="130" fill="#161B22" stroke="#388BFD" stroke-width="2" rx="12" filter="url(#glow)">
      <animate attributeName="stroke" values="#388BFD;#58A6FF;#388BFD" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="85" y="45" fill="#C9D1D9" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Gemini Engine</text>
    
    <rect width="130" height="30" x="20" y="70" fill="#0D1117" stroke="#3FB950" stroke-width="1" rx="4"/>
    <text x="85" y="89" fill="#3FB950" font-family="monospace" font-size="11" text-anchor="middle">mime: application/json</text>
  </g>

  <!-- Right Node: SQLite Persistence -->
  <g transform="translate(660, 90)">
    <!-- DB Cylinder Shape -->
    <path d="M 25 15 C 25 -5, 105 -5, 105 15 L 105 85 C 105 105, 25 105, 25 85 Z" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <path d="M 25 15 C 25 35, 105 35, 105 15" fill="none" stroke="#30363D" stroke-width="2"/>
    
    <text x="65" y="-15" fill="#8B949E" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">DETERMINISTIC STATE</text>
    
    <!-- JSON Schema brackets jumping -->
    <text x="65" y="60" fill="#3FB950" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle">{ }</text>
    
    <!-- Pulsing success indicator -->
    <circle cx="65" cy="65" r="4" fill="#3FB950" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="r" values="4;15;4" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>
</svg>
