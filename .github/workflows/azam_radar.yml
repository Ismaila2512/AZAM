name: AZAM Radar Cloud Engine

on:
  schedule:
    - cron: '0 */3 * * *' # Every 1.5 hours (at :00 for hours 0,3,6,9,12,15,18,21)
    - cron: '30 1,4,7,10,13,16,19,22 * * *' # Every 1.5 hours (at :30 for hours 1,4,7,10,13,16,19,22)
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write # Needed to push commits back to repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai python-dotenv openpyxl reportlab

      - name: Run Main Internship Engine
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Run Shortlist Engine
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python shortlist_bot.py

      - name: Commit and Push Changes
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add internships.db index.html pdfs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "⚡ AZAM: Database and Dashboard refreshed" && git push)
